# =============================================
# APPLICATION
# =============================================
spring.application.name=scaffold
server.port=8080

# =============================================
# ACTIVE PROFILE
# =============================================
spring.profiles.active=dev

# =============================================
# H2 DATABASE (desarrollo local)
# =============================================
spring.datasource.url=jdbc:h2:mem:scaffolddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =============================================
# MYSQL DATABASE (produccion) — descomentar y configurar para produccion
# =============================================
# spring.datasource.url=jdbc:mysql://localhost:3306/scaffolddb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_password_here

# =============================================
# JPA / HIBERNATE
# =============================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Para MySQL usar: org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =============================================
# LOGGING
# =============================================
logging.level.com.mx.development.said=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
